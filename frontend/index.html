<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Estoque de Periféricos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho -->
        <header class="app-header">
            <h1>⌨️ TechStore - Estoque de Periféricos</h1>
            <p>Gerenciamento e consulta de hardware e acessórios em tempo real</p>
        </header>

        <!-- Formulário para POST (Cadastrar Periférico) -->
        <section class="card-section">
            <h2>➕ Cadastrar Novo Periférico</h2>
            <form id="formCadastro" class="crud-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nomeInput">Nome do Periférico*</label>
                        <input type="text" id="nomeInput" placeholder="Ex: Teclado Mecânico RGB" required>
                    </div>

                    <div class="form-group">
                        <label for="precoInput">Preço (R$)*</label>
                        <input type="number" id="precoInput" step="0.01" min="0" placeholder="Ex: 299.90" required>
                    </div>

                    <div class="form-group">
                        <label for="estoqueInput">Estoque*</label>
                        <input type="number" id="estoqueInput" min="0" placeholder="Ex: 15" required>
                    </div>

                    <div class="form-group">
                        <label for="categoriaInput">Categoria*</label>
                        <select id="categoriaInput" required>
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Teclados">Teclados</option>
                            <option value="Mouses">Mouses</option>
                            <option value="Headsets">Headsets</option>
                            <option value="Monitores">Monitores</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                </div>
                <button type="submit" id="btnSalvar" class="btn btn-success">
                    💾 Cadastrar Periférico
                </button>
            </form>
        </section>

        <!-- Barra de Ações & Filtro -->
        <section class="action-bar-container">
            <div class="action-bar">
                <button id="lbButton" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                        <path d="M21 3v5h-5"/>
                    </svg>
                    Carregar Produtos
                </button>

                <!-- Campo de Filtro/Busca -->
                <div class="filter-box">
                    <input type="text" id="filterInput" placeholder="🔍 Buscar por nome do periférico...">
                </div>
            </div>
        </section>

        <!-- Área dos Produtos / Lista -->
        <main>
            <section id="cProdutos" class="products-container">
                <div class="empty-state">
                    <div class="icon">🖱️</div>
                    <h2>Nenhum periférico carregado</h2>
                    <p>Clique em "Carregar Produtos" para consultar o estoque.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="./acervo.js"></script>
</body>
</html>
