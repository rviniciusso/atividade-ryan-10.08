<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta e Cadastro de Livros - CRUD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho -->
        <header class="app-header">
            <h1>📚 Sistema de Estoque de Livros</h1>
            <p>Cadastre e consulte o acervo em tempo real</p>
        </header>

        <!-- NOVO: Formulário para POST (Cadastrar) -->
        <section class="card-section">
            <h2>➕   Cadastrar Novo Livro</h2>
            <form id="formCadastro" class="crud-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="tituloInput">Título do Livro*</label>
                        <input type="text" id="tituloInput" placeholder="Ex: Dom Casmurro" required>
                    </div>
                    <div class="form-group">
                        <label for="autorInput">Autor*</label>
                        <input type="text" id="autorInput" placeholder="Ex: Machado de Assis" required>
                    </div>
                    <div class="form-group">
                        <label for="qtdInput">Quantidade*</label>
                        <input type="number" id="qtdInput" min="1" placeholder="Ex: 10" required>
                    </div>
                </div>
                <button type="submit" id="btnSalvar" class="btn btn-success">Salvar Produto</button>
            </form>
        </section>

        <!-- Barra de Ações & Filtro -->
        <section class="action-bar-container">
            <div class="action-bar">
                <button id="lbButton" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                    Carregar Produtos
                </button>

                <!-- NOVO: Campo de Filtro (Busca local/GET com parâmetro) -->
                <div class="filter-box">
                    <input type="text" id="filterInput" placeholder="🔍 Filtrar por título ou autor...">
                </div>
            </div>
        </section>

        <!-- Área dos Produtos / Lista -->
        <main>
            <section id="cProdutos" class="products-container">
                <div class="empty-state">
                    <div class="icon">📦</div>
                    <h2>Sem produtos carregados</h2>
                    <p>Clique em "Carregar Produtos" para listar o acervo.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="./acervo.js"></script>
</body>
</html>
